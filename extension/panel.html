<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ventana</title>
<style>
  body { font-family: -apple-system, sans-serif; font-size: 13px; margin: 0; padding: 12px; color: #1a1a1a; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  h1 { font-size: 15px; margin: 0; }
  .header-right { display: flex; align-items: center; gap: 6px; }
  #status { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eee; }
  #status.connected { background: #d7f2d7; color: #1a6e1a; }
  #status.disconnected { background: #f2d7d7; color: #8a1a1a; }
  #localeSwitch button { font-size: 11px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; }
  #localeSwitch button.active { background: #1a3d6e; color: #fff; border-color: #1a3d6e; }
  #indexInfo { font-size: 12px; color: #444; margin: 8px 0; }
  #replyArea { font-size: 12px; margin: 8px 0; padding: 6px 8px; border-radius: 4px; }
  #replyArea.ok { background: #eef3fb; color: #1a1a1a; }
  #replyArea.error { background: #f2d7d7; color: #8a1a1a; }
  #replyArea:empty { display: none; }
  textarea { width: 100%; box-sizing: border-box; min-height: 70px; margin: 8px 0; }
  button { font-size: 12px; padding: 4px 10px; cursor: pointer; }
  section { margin-top: 14px; }
  h2 { font-size: 12px; color: #555; margin: 0 0 4px 0; text-transform: uppercase; }
  #trace { font-size: 12px; color: #666; }
  .action-row { border: 1px solid #ddd; border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; }
  .action-row .reason { font-size: 12px; margin-bottom: 4px; }
  .action-row .row-buttons button { margin-right: 6px; }
  .action-row.approved { opacity: 0.5; }
  #actions:empty::before, #actions.empty::after { content: ""; }
  #actionsEmpty { font-size: 12px; color: #666; }
  .trace-step { font-size: 11px; color: #666; }
</style>
</head>
<body>
  <header>
    <h1 id="panelTitle">Ventana</h1>
    <div class="header-right">
      <div id="localeSwitch">
        <button id="localeEsBtn" type="button">ES</button>
        <button id="localeEnBtn" type="button">EN</button>
      </div>
      <span id="status">…</span>
    </div>
  </header>

  <button id="indexBtn"></button>
  <div id="indexInfo"></div>

  <textarea id="messageInput"></textarea>
  <button id="submitBtn"></button>

  <div id="replyArea"></div>

  <section>
    <h2 id="actionsTitle"></h2>
    <div id="actionsEmpty"></div>
    <div id="actions"></div>
  </section>

  <section>
    <h2 id="traceTitle"></h2>
    <div id="trace"></div>
  </section>

  <script src="i18n/index.js"></script>
  <script src="panel.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ventana</title>
<style>
  :root {
    --accent: #1a3d6e;
    --accent-hover: #234e8a;
    --bg: #ffffff;
    --bg-subtle: #f6f8fb;
    --border: #dde3ea;
    --text: #1a1a1a;
    --text-muted: #5b6472;
    --ok-bg: #eef3fb;
    --error-bg: #fbe9e9;
    --error-text: #8a1a1a;
    --success-bg: #e3f5e6;
    --success-text: #1a6e1a;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    margin: 0;
    padding: 14px;
    color: var(--text);
    background: var(--bg);
  }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .header-right { display: flex; align-items: center; gap: 8px; }

  #status { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--bg-subtle); color: var(--text-muted); }
  #status.connected { background: var(--success-bg); color: var(--success-text); }
  #status.disconnected { background: var(--error-bg); color: var(--error-text); }

  #localeSwitch { display: inline-flex; padding: 2px; background: var(--bg-subtle); border-radius: 999px; border: 1px solid var(--border); }
  #localeSwitch button {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border: none; border-radius: 999px;
    background: transparent; color: var(--text-muted); cursor: pointer; transition: background .15s, color .15s;
  }
  #localeSwitch button.active { background: var(--accent); color: #fff; }
  #localeSwitch button:not(.active):hover { color: var(--text); }

  #indexInfo { font-size: 12px; color: var(--text-muted); margin: 8px 0; }

  #replyArea { font-size: 12px; margin: 10px 0; padding: 8px 10px; border-radius: var(--radius); }
  #replyArea.ok { background: var(--ok-bg); color: var(--text); }
  #replyArea.error { background: var(--error-bg); color: var(--error-text); }
  #replyArea:empty { display: none; }

  textarea {
    width: 100%; min-height: 72px; margin: 8px 0; padding: 8px 10px;
    font-family: inherit; font-size: 13px; color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); resize: vertical;
  }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  button {
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg);
    color: var(--text); cursor: pointer; transition: background .15s, border-color .15s, transform .05s;
  }
  button:hover { background: var(--bg-subtle); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #submitBtn { background: var(--accent); color: #fff; border-color: var(--accent); }
  #submitBtn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  section { margin-top: 16px; }
  h2 { font-size: 11px; font-weight: 700; color: var(--text-muted); margin: 0 0 6px 0; text-transform: uppercase; letter-spacing: .04em; }

  #trace { font-size: 12px; color: var(--text-muted); }
  .trace-step { font-size: 11px; color: var(--text-muted); padding: 2px 0; }

  .action-row {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px;
    background: var(--bg); box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  .action-row .reason { font-size: 12px; margin-bottom: 8px; color: var(--text); }
  .action-row .row-buttons { display: flex; gap: 8px; }
  .action-row .row-buttons button { margin-right: 0; }
  .action-row .row-buttons button:first-child { background: var(--accent); color: #fff; border-color: var(--accent); }
  .action-row .row-buttons button:first-child:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .action-row .row-buttons button:last-child { background: var(--bg); color: var(--text-muted); }
  .action-row.approved { opacity: 0.55; }

  #actions:empty::before, #actions.empty::after { content: ""; }
  #actionsEmpty { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <header>
    <h1 id="panelTitle">Ventana</h1>
    <div class="header-right">
      <div id="localeSwitch">
        <button id="localeEsBtn" type="button">ES</button>
        <button id="localeEnBtn" type="button">EN</button>
      </div>
      <span id="status">…</span>
    </div>
  </header>

  <button id="indexBtn"></button>
  <div id="indexInfo"></div>

  <textarea id="messageInput"></textarea>
  <button id="submitBtn"></button>

  <div id="replyArea"></div>

  <section>
    <h2 id="actionsTitle"></h2>
    <div id="actionsEmpty"></div>
    <div id="actions"></div>
  </section>

  <section>
    <h2 id="traceTitle"></h2>
    <div id="trace"></div>
  </section>

  <script src="i18n/index.js"></script>
  <script src="panel.js"></script>
</body>
</html>
